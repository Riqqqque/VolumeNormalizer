<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volume Normalizer</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #080c12;
      --panel: #111822;
      --panel-raised: #17212e;
      --panel-soft: #1b2735;
      --line: rgba(218, 233, 255, 0.1);
      --line-strong: rgba(218, 233, 255, 0.18);
      --text: #f4f8ff;
      --text-soft: #c4cfdd;
      --muted: #7f8d9f;
      --cyan: #2ad5e8;
      --blue: #4b7fff;
      --accent: linear-gradient(100deg, var(--cyan), var(--blue));
      --accent-soft: rgba(42, 213, 232, 0.1);
      --success: #68dfb5;
      --danger: #ff8092;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 388px;
      background: var(--canvas);
    }

    body {
      width: 388px;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 96% -4%, rgba(75, 127, 255, 0.19), transparent 31%),
        radial-gradient(circle at -8% 20%, rgba(42, 213, 232, 0.12), transparent 28%),
        var(--canvas);
      font-family: "Bahnschrift", "Aptos Display", "Segoe UI Variable Display", sans-serif;
      font-synthesis: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .shell {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    .shell > * {
      animation: reveal 380ms var(--ease-out) both;
    }

    .shell > :nth-child(2) {
      animation-delay: 45ms;
    }

    .shell > :nth-child(3) {
      animation-delay: 90ms;
    }

    .shell > :nth-child(4) {
      animation-delay: 120ms;
    }

    .topbar,
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
    }

    .topbar {
      position: relative;
      display: flex;
      min-height: 90px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      overflow: hidden;
      padding: 16px 17px;
      border-radius: var(--radius-xl);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.25);
    }

    .topbar::after {
      content: "";
      position: absolute;
      right: -24px;
      bottom: -52px;
      width: 150px;
      height: 92px;
      border: 1px solid rgba(42, 213, 232, 0.13);
      border-radius: 50%;
      transform: rotate(-16deg);
      pointer-events: none;
    }

    .brand-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .eyebrow,
    .section-label {
      color: var(--cyan);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 7px;
      font-size: 21px;
      font-weight: 680;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .tagline {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .coverage {
      position: relative;
      z-index: 1;
      display: grid;
      min-width: 70px;
      min-height: 58px;
      flex: 0 0 auto;
      place-content: center;
      border: 1px solid rgba(42, 213, 232, 0.16);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(42, 213, 232, 0.12), rgba(75, 127, 255, 0.07));
      text-align: center;
    }

    .coverage-value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .coverage-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .panel {
      border-radius: var(--radius-xl);
    }

    .target-panel {
      position: relative;
      overflow: hidden;
      padding: 16px;
    }

    .target-panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 2px;
      background: var(--accent);
    }

    .target-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    h2 {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .tone-badge {
      padding: 6px 9px;
      border: 1px solid rgba(42, 213, 232, 0.18);
      border-radius: 999px;
      background: var(--accent-soft);
      color: #c8f8ff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .target-control {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      margin-top: 14px;
    }

    .volume-readout {
      display: inline-grid;
      grid-auto-flow: column;
      grid-template-columns: max-content max-content;
      width: 112px;
      height: 72px;
      align-items: baseline;
      justify-content: center;
      overflow: hidden;
      padding: 13px 8px 9px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(145deg, rgba(42, 213, 232, 0.09), transparent 60%),
        var(--panel-raised);
    }

    .volume-input {
      box-sizing: content-box;
      width: var(--volume-input-width, 2ch);
      min-width: 0;
      margin: 0;
      padding: 0 2px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 38px;
      font-weight: 680;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.055em;
      line-height: 1;
      text-align: center;
    }

    .volume-input::selection {
      background: rgba(42, 213, 232, 0.3);
    }

    .percent-sign {
      margin-left: 0;
      color: var(--text-soft);
      font-size: 16px;
      font-weight: 650;
      line-height: 1;
    }

    .range-stack {
      display: grid;
      min-width: 0;
      gap: 8px;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .volume-slider {
      --volume-percent: 25%;
      width: 100%;
      height: 24px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--cyan) 0,
        var(--blue) var(--volume-percent),
        var(--panel-soft) var(--volume-percent),
        var(--panel-soft) 100%
      );
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
    }

    .volume-slider::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--panel-soft);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
    }

    .volume-slider::-moz-range-progress {
      height: 7px;
      border-radius: 999px;
      background: var(--accent);
    }

    .volume-slider::-webkit-slider-thumb {
      width: 19px;
      height: 19px;
      margin-top: -6px;
      border: 3px solid #edfaff;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: #101924;
      box-shadow: 0 0 0 4px rgba(42, 213, 232, 0.1);
    }

    .volume-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid #edfaff;
      border-radius: 50%;
      background: #101924;
      box-shadow: 0 0 0 4px rgba(42, 213, 232, 0.1);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 13px;
    }

    .preset,
    .bulk-button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      transition:
        transform 120ms ease,
        border-color 120ms ease,
        background-color 120ms ease,
        color 120ms ease;
    }

    .preset {
      min-height: 34px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .preset:hover,
    .bulk-button:hover {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.055);
      color: var(--text-soft);
    }

    .preset[aria-pressed="true"] {
      border-color: rgba(42, 213, 232, 0.32);
      background: var(--accent-soft);
      color: #d8fbff;
    }

    .preset:active,
    .bulk-button:active {
      transform: translateY(1px);
    }

    .sites-panel {
      overflow: hidden;
    }

    .sites-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px 12px;
      border-bottom: 1px solid var(--line);
    }

    .sites-heading-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .sites-total {
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .bulk-actions {
      display: flex;
      gap: 6px;
    }

    .bulk-button {
      min-width: 46px;
      height: 28px;
      padding: 0 9px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .bulk-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .bulk-button:disabled:active {
      transform: none;
    }

    .bulk-button.danger:hover:not(:disabled) {
      border-color: rgba(255, 128, 146, 0.26);
      color: #ffb4c0;
    }

    .sites-viewport {
      height: 164px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px;
      scrollbar-color: rgba(196, 207, 221, 0.24) transparent;
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }

    .sites-viewport::-webkit-scrollbar {
      width: 7px;
    }

    .sites-viewport::-webkit-scrollbar-thumb {
      border: 2px solid transparent;
      border-radius: 999px;
      background: rgba(196, 207, 221, 0.25);
      background-clip: padding-box;
    }

    .sites-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      contain: layout paint;
    }

    .site-toggle {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 34px;
      min-height: 46px;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.022);
      cursor: pointer;
      transition:
        border-color 120ms ease,
        background-color 120ms ease,
        opacity 120ms ease;
    }

    .site-toggle:hover {
      border-color: var(--line-strong);
      background: rgba(255, 255, 255, 0.04);
    }

    .site-toggle[data-enabled="true"] {
      border-color: rgba(42, 213, 232, 0.13);
      background: rgba(42, 213, 232, 0.045);
    }

    .site-toggle[data-enabled="false"] {
      opacity: 0.57;
    }

    .site-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      background: var(--panel-soft);
      color: #e3edf8;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .site-name {
      overflow: hidden;
      color: var(--text-soft);
      font-size: 10px;
      font-weight: 650;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .switch-input {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #283342;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #bdc8d5;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      transition: transform 140ms var(--ease-out), background-color 140ms ease;
    }

    .switch-input:checked + .switch-track {
      border-color: rgba(42, 213, 232, 0.4);
      background: var(--cyan);
    }

    .switch-input:checked + .switch-track::after {
      transform: translateX(14px);
      background: #f8feff;
    }

    .volume-slider:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5px var(--cyan);
    }

    .volume-slider:focus-visible::-moz-range-thumb {
      box-shadow: 0 0 0 3px var(--canvas), 0 0 0 5px var(--cyan);
    }

    .switch-input:focus-visible + .switch-track,
    .preset:focus-visible,
    .bulk-button:focus-visible,
    .volume-input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 5px 0;
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
    }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .save-state::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
    }

    .save-state[data-state="saving"]::before {
      background: var(--cyan);
      animation: pulse 800ms ease-in-out infinite;
    }

    .save-state[data-state="error"] {
      color: #ffb4c0;
    }

    .save-state[data-state="error"]::before {
      background: var(--danger);
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      50% {
        opacity: 0.32;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-copy">
        <div class="eyebrow">Volume normalizer</div>
        <h1>Control the loud.</h1>
        <p class="tagline">One output target across every supported player.</p>
      </div>
      <div class="coverage" aria-label="Enabled sites">
        <span class="coverage-value" id="enabledSitesValue" aria-live="polite">19/19</span>
        <span class="coverage-label">active</span>
      </div>
    </header>

    <section class="panel target-panel" aria-labelledby="targetHeading">
      <div class="target-head">
        <div>
          <div class="section-label">Master level</div>
          <h2 id="targetHeading">Output target</h2>
        </div>
        <span class="tone-badge" id="volumeTone">Balanced</span>
      </div>

      <div class="target-control">
        <label class="volume-readout" for="volumeInput">
          <input type="text" id="volumeInput" class="volume-input" inputmode="numeric" maxlength="3" value="25" aria-label="Target volume percentage" autocomplete="off" spellcheck="false">
          <span class="percent-sign" aria-hidden="true">%</span>
        </label>

        <div class="range-stack">
          <div class="range-labels" aria-hidden="true">
            <span>Quiet</span>
            <span>Max</span>
          </div>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="25" aria-label="Target volume">
        </div>
      </div>

      <div class="presets" id="presetButtons" aria-label="Volume presets">
        <button class="preset" type="button" data-volume="15" aria-pressed="false">15%</button>
        <button class="preset" type="button" data-volume="25" aria-pressed="true">25%</button>
        <button class="preset" type="button" data-volume="50" aria-pressed="false">50%</button>
        <button class="preset" type="button" data-volume="75" aria-pressed="false">75%</button>
      </div>
    </section>

    <section class="panel sites-panel" aria-labelledby="sitesHeading">
      <div class="sites-head">
        <div>
          <div class="section-label">Site controls</div>
          <div class="sites-heading-row">
            <h2 id="sitesHeading">Supported players</h2>
            <span class="sites-total" id="sitesTotalValue">19 sites</span>
          </div>
        </div>
        <div class="bulk-actions" aria-label="Bulk site controls">
          <button class="bulk-button" id="enableAllButton" type="button">All</button>
          <button class="bulk-button danger" id="disableAllButton" type="button">None</button>
        </div>
      </div>

      <div class="sites-viewport">
        <div class="sites-grid" id="sitesList"></div>
      </div>
    </section>

    <footer class="footer">
      <span class="save-state" id="saveStatus" data-state="saved" aria-live="polite">Saved</span>
      <span id="versionValue"></span>
    </footer>
  </main>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>

</html>
